services:
  db-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: modulo_test
      POSTGRES_PASSWORD: modulo_test
      POSTGRES_DB: modulo_test
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modulo_test"]
      interval: 2s
      timeout: 5s
      retries: 10
