app = 'staging-modulo'

# ===== Machine budget (stay within the org limit) =====
# Standing footprint: 1 x app + 1 x worker = 2 machines for this app.
# Whole-org standing: app-modulo 3 + staging-modulo 2 + DBs 2 = 7.
# Rolling deploys peak at N+1 per process group; keep the org total
# (incl. prod + DBs) under the Fly machine limit (~10 on the
# personal plan). There is no automated budget guard in CI: deploy.yml only
# prunes group-less strays ("Clean up stray machines"), so the limit is
# enforced by this standing footprint + manual review before scaling up.
# Do NOT add process groups or machines without updating this block.
primary_region = 'lhr'

[deploy]
  strategy = 'rolling'

[release]
  command = "/release.sh"

[build]
  dockerfile = "backend/Dockerfile.fly"

[processes]
  app = ""
  worker = ""

# Web process group — nginx + uvicorn, handles HTTP traffic
[[restart]]
  processes = ['app']
  policy = "never"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1  # budget: staging runs 1 app machine (scaled down 2026-08-15 to stay within the org machine limit)
  processes = ['app']
  # Graceful worker drain window (plan F8).
  kill_timeout = 120

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "240s"
    method = "GET"
    path = "/healthz/ready"
    protocol = "http"

[env]
  MODULO_DB = "postgres"
  # MODULO_SYSTEM_DATABASE_URL is DERIVED AT BOOT (not set here): bootstrap_db.py
  # derives it from DATABASE_URL with the modulo_system role (LOGIN, BYPASSRLS)
  # and entrypoint.sh exports it. It contains a password, so no literal value.
  MODULO_PUBLIC_URL = "https://staging.modulo.run"
  MODULO_PLUGIN_DISCOVERY = "false"
  # Staging-only dev-mode toggle (preview/in-development features via Admin > Feature Flags).
  MODULO_DEV_MODE = "true"
  MODULO_MAX_LOCAL_CONCURRENCY = "4"
  # 2026-09 Redis-usage audit (August Fly invoice): staging ran the SAME SAQ
  # worker concurrency as prod (2 workers x 20 slots = 40 blocking blmove
  # dequeue pollers re-issued every 5s ~= 691k dequeue commands/day) plus the
  # system worker's 14 cron-registration EVALSHAs per 5s schedule tick —
  # polling parity with prod at ~zero human traffic. SAQ issues one blocking
  # dequeue per concurrency slot, so polling volume scales linearly with
  # SAQ_WORKER_CONCURRENCY: 2 slots per worker cuts the dequeue stream ~10x
  # (~69k/day). Concurrency 2 still covers staging's preview/e2e runs; the
  # pool keeps the documented invariant pool > concurrency + 5 (10 > 7, within
  # the settings cap of 50). Both Fly Redis DBs sit on the Fixed 250MB plan
  # (flat $15/mo, verified 2026-09-02), so this trims load/bandwidth rather
  # than billing — but it is the prerequisite if staging ever returns to PAYG.
  SAQ_WORKER_CONCURRENCY = "2"
  # Redis pool must exceed SAQ worker concurrency (blocking dequeue holds one
  # pool connection per concurrent task). Must stay > SAQ_WORKER_CONCURRENCY.
  SAQ_REDIS_POOL_SIZE = "10"
  # REQUIRED: Upstash Redis instance. Create with:
  #   fly redis create --name modulo-staging-redis -r lhr,ams --enable-eviction
  # Then store its connection string with `fly secrets set REDIS_URL=...`.
  CORS_ORIGINS = "https://modulo.run,https://staging.modulo.run,http://localhost:5173"

# Worker process-group health check (ADR 021). Top-level [checks], not a service
# check — it does not affect routing. The worker container exposes a liveness
# server on 8082 (entrypoint.sh worker branch) that returns 200 only while BOTH
# SAQ worker subprocesses (runs + system) are alive.
[checks]
  [checks.worker_health]
    interval = "15s"
    timeout = "5s"
    grace_period = "240s"
    method = "GET"
    path = "/"
    port = 8082
    type = "http"
    processes = ['worker']

# Worker process group — SAQ workers only, ALWAYS restart (ADR 021).
# policy = "always" restarts the machine no matter the exit code. "on-failure"
# only restarts a non-zero exit, so a worker machine a rolling deploy leaves
# `stopped` (clean exit / SIGTERM teardown) stays down — the 2026-08-08 prod
# outage. "always" is the Fly-documented policy for long-running background
# workers: crash, clean exit, or deploy replacement all self-heal.
[[restart]]
  processes = ['worker']
  policy = "always"

[[vm]]
  processes = ['app']
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2

[[vm]]
  processes = ['worker']
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
