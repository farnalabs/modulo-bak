# SonarCloud configuration (read by SonarSource/sonarqube-scan-action).
#
# Only genuinely non-meaningful, data/framework-shaped repetition is excluded
# from the copy-paste (duplication) gate:
#   * frontend/src/locales/**  : i18n catalogs whose `"key": "value"` structure
#                                is data, not logic, and routinely trips the
#                                gate against existing entries.
#   * frontend/src/__tests__/** : specs share mock/setup boilerplate
#                                (vi.mock, setActivePinia, mount) with the rest
#                                of the suite, which is expected.
#   * backend/tests/**          : the unit/integration suites share heavy
#                                mock/setup boilerplate (_make_mock_session,
#                                FakeSession, RLS GUC setup, side_effect lists)
#                                with one another and with copy-paste test
#                                variants (test_executor*). This repetition is
#                                expected test scaffolding, not logic, and
#                                trips the new-code duplication gate on every
#                                large test PR without signalling real risk.
#
# Production source added by this PR is intentionally NOT excluded, so genuine
# logic duplication is surfaced rather than hidden by widening the gate.
sonar.cpd.exclusions=frontend/src/locales/**,frontend/src/__tests__/**,backend/tests/**
